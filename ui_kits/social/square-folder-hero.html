<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LixenAI — Square Folder Hero</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800&family=Inter:wght@500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../../styles.css" />
    <style>
      /* 1080×1080 (1:1) fixed canvas, scaled to fit the viewport */
      html,
      body {
        height: 100%;
        overflow: hidden;
        background: var(--hl-bg-deep);
      }

      .slide-scaler {
        position: fixed;
        top: 0;
        left: 0;
        transform-origin: top left;
      }

      .slide {
        width: 1080px;
        height: 1080px;
      }

      .slide-inner {
        position: relative;
        z-index: 1;
        width: 100%;
        height: 100%;
        padding: 80px 80px 60px;
        display: flex;
        flex-direction: column;
        align-items: center;
      }

      .slide .hl-kicker {
        font-size: 19px;
        margin-bottom: 18px;
      }

      .slide h1 {
        font-size: 74px;
        text-align: center;
        text-shadow: 0 4px 30px rgba(37, 99, 235, 0.12);
      }

      .slide .hl-sub {
        font-size: 24px;
        text-align: center;
        max-width: 820px;
        margin-top: 16px;
        white-space: nowrap;
      }

      /* Hero stage */
      .hero {
        position: relative;
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: flex-end;
        width: 100%;
      }

      .hero .hl-ring-deco {
        left: 50%;
        top: 44%;
      }
      .hero .ring-a { width: 520px; height: 520px; margin: -260px 0 0 -260px; }
      .hero .ring-b { width: 700px; height: 700px; margin: -350px 0 0 -350px; opacity: 0.6; }

      .hero .hl-beam {
        width: 440px;
        height: 300px;
        left: 50%;
        top: 6%;
        transform: translateX(-50%);
      }

      .folder-scene {
        position: relative;
      }

      /* Glossy 3D folder */
      .folder {
        position: relative;
        width: 380px;
        height: 272px;
        filter: drop-shadow(0 40px 50px rgba(37, 99, 235, 0.38));
      }

      .folder .back {
        position: absolute;
        inset: 0;
        border-radius: 30px;
        background: linear-gradient(160deg, #3b82f6 0%, #1d4ed8 70%, #1b2a6b 100%);
      }

      .folder .tab {
        position: absolute;
        top: -36px;
        left: 0;
        width: 176px;
        height: 64px;
        border-radius: 24px 24px 0 0;
        background: linear-gradient(160deg, #60a5fa, #2563eb);
        box-shadow: inset 0 2px 0 rgba(255, 255, 255, 0.4);
      }

      /* Peeking contents: photo card, chart card, doc */
      .peek {
        position: absolute;
        border-radius: 16px;
        box-shadow: 0 -8px 22px rgba(27, 42, 107, 0.22);
      }

      .peek.photo {
        left: -48px;
        top: -54px;
        width: 136px;
        height: 166px;
        background: #ffffff;
        padding: 10px;
        transform: rotate(-11deg);
      }
      .peek.photo .ph {
        width: 100%;
        height: 118px;
        border-radius: 10px;
        background:
          radial-gradient(circle at 74% 22%, #fde68a 0%, transparent 26%),
          linear-gradient(180deg, #7dd3fc 0%, #38bdf8 55%, #22d3ee 100%);
        position: relative;
        overflow: hidden;
      }
      .peek.photo .ph::after {
        content: "";
        position: absolute;
        left: -10%;
        bottom: -12%;
        width: 120%;
        height: 55%;
        background: linear-gradient(160deg, #2563eb 0%, #1b2a6b 100%);
        clip-path: polygon(0 100%, 22% 20%, 45% 70%, 68% 10%, 100% 100%);
      }
      .peek.photo .cap {
        height: 9px;
        border-radius: 5px;
        background: rgba(37, 99, 235, 0.25);
        margin-top: 12px;
      }
      .peek.photo .cap.short { width: 60%; margin-top: 8px; }

      .peek.chart {
        right: -42px;
        top: -46px;
        width: 140px;
        height: 140px;
        background: linear-gradient(180deg, #ffffff 0%, #eef5fd 100%);
        transform: rotate(7deg);
        padding: 16px;
      }
      .peek.chart .bars {
        display: flex;
        align-items: flex-end;
        gap: 10px;
        height: 78px;
      }
      .peek.chart .bars i {
        flex: 1;
        border-radius: 6px 6px 3px 3px;
        background: linear-gradient(180deg, #22d3ee, #2563eb);
        box-shadow: inset 0 2px 2px rgba(255, 255, 255, 0.5);
      }
      .peek.chart .trend {
        margin-top: 10px;
        height: 10px;
        border-radius: 5px;
        background: rgba(245, 158, 11, 0.85);
        width: 62%;
      }

      .peek.doc {
        left: 62px;
        right: 62px;
        top: -76px;
        bottom: 108px;
        background: linear-gradient(180deg, #ffffff 0%, #e8f1fc 100%);
        padding: 22px 26px 0;
      }
      .peek.doc .line {
        height: 10px;
        border-radius: 6px;
        background: rgba(37, 99, 235, 0.22);
      }
      .peek.doc .line + .line { margin-top: 13px; }
      .peek.doc .line.title { width: 46%; background: rgba(27, 42, 107, 0.4); }
      .peek.doc .line.short { width: 62%; }

      .folder .front {
        position: absolute;
        inset: 66px 0 0 0;
        border-radius: 28px;
        background:
          linear-gradient(165deg, rgba(255, 255, 255, 0.5) 0%, rgba(255, 255, 255, 0) 42%),
          linear-gradient(160deg, #60a5fa 0%, #2563eb 55%, #1e40af 100%);
        box-shadow:
          inset 0 3px 0 rgba(255, 255, 255, 0.6),
          inset 0 -12px 26px rgba(20, 32, 90, 0.35);
        transform: perspective(900px) rotateX(9deg);
        transform-origin: bottom center;
      }

      .folder .front .shine {
        position: absolute;
        inset: 0;
        border-radius: 28px;
        background: radial-gradient(120% 90% at 24% 8%, rgba(255, 255, 255, 0.55) 0%, transparent 46%);
      }

      .folder .front .emboss {
        position: absolute;
        left: 30px;
        right: 30px;
        bottom: 26px;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      .folder .front .emboss .dots { display: flex; gap: 8px; }
      .folder .front .emboss .dots i {
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.35);
        box-shadow: inset 0 1px 2px rgba(20, 32, 90, 0.4);
      }
      .folder .front .emboss .slot {
        width: 92px;
        height: 10px;
        border-radius: 6px;
        background: rgba(20, 32, 90, 0.28);
        box-shadow: 0 1px 0 rgba(255, 255, 255, 0.35);
      }

      .folder .badge {
        position: absolute;
        left: 50%;
        top: 56%;
        transform: translate(-50%, -50%);
        z-index: 2;
        width: 96px;
        height: 96px;
        border-radius: 50%;
        display: grid;
        place-items: center;
        background: radial-gradient(circle at 32% 26%, rgba(255, 255, 255, 0.5) 0%, transparent 40%),
          linear-gradient(150deg, #67e8f9 0%, #22d3ee 45%, #2563eb 100%);
        box-shadow:
          0 14px 30px rgba(8, 47, 122, 0.45),
          inset 0 3px 4px rgba(255, 255, 255, 0.7),
          inset 0 -6px 12px rgba(20, 32, 90, 0.4);
      }
      .folder .badge svg { width: 46px; height: 46px; }

      /* Orbiting glossy mini icon tiles */
      .float-tile {
        position: absolute;
        z-index: 3;
        font-size: 19px;
        animation: hl-hover-float 5.5s ease-in-out infinite;
      }
      .ft1 { left: -98px; top: 28px; animation-delay: 0.4s; }
      .ft2 { right: -96px; top: 108px; animation-delay: 1.3s; }
      .ft3 { left: -70px; bottom: -8px; animation-delay: 2.1s; font-size: 15px; }

      .star {
        position: absolute;
        color: var(--hl-gold);
        filter: drop-shadow(0 0 10px rgba(245, 158, 11, 0.8));
        animation: hl-hover-float 5s ease-in-out infinite;
        z-index: 3;
      }

      .hero .hl-pedestal { margin-top: -12px; }
      .hero .hl-pedestal-disc.d1 { width: 460px; height: 70px; }
      .hero .hl-pedestal-disc.d2 { width: 344px; height: 54px; margin-top: -44px; }
      .hero .hl-pedestal-disc.d3 { width: 230px; height: 36px; margin-top: -32px; }
      .hero .hl-pedestal-core { width: 230px; height: 56px; bottom: 12px; }

      .hero .pedestal-reflection {
        width: 400px;
        height: 30px;
        margin-top: 8px;
        border-radius: 50%;
        background: radial-gradient(ellipse, rgba(37, 99, 235, 0.28) 0%, transparent 70%);
        filter: blur(7px);
      }

      .stats {
        position: relative;
        z-index: 2;
        display: flex;
        gap: 20px;
        justify-content: center;
        margin-top: 30px;
        font-size: 17px;
      }

      .chips {
        position: relative;
        z-index: 2;
        display: flex;
        gap: 18px;
        justify-content: center;
        margin-top: 22px;
      }

      .chips .hl-chip { font-size: 17px; }

      .brand {
        margin-top: 24px;
        font-family: var(--hl-font-display);
        font-weight: 800;
        letter-spacing: 0.26em;
        font-size: 19px;
        color: var(--hl-navy);
        text-transform: uppercase;
      }

      .brand span { color: var(--hl-primary); }
    </style>
  </head>
  <body>
    <div class="slide-scaler" id="scaler">
      <main class="slide hl-canvas">
        <!-- Ambient decoration layers -->
        <div class="hl-dotgrid"></div>
        <div class="hl-bokeh" style="width: 280px; height: 280px; left: -80px; top: 180px"></div>
        <div class="hl-bokeh" style="width: 220px; height: 220px; right: -60px; top: 420px"></div>
        <div class="hl-bokeh hl-bokeh--warm" style="width: 240px; height: 240px; right: -60px; bottom: -50px"></div>
        <div class="hl-bokeh hl-bokeh--warm" style="width: 180px; height: 180px; left: -40px; top: -40px"></div>

        <canvas class="hl-sparkles" id="sparkles"></canvas>

        <div class="slide-inner">
          <div class="hl-kicker hl-enter" style="--hl-delay: 0s">Content, Organized</div>
          <h1 class="hl-heading hl-enter" style="--hl-delay: 0.06s">
            Every Asset.<br /><span class="hl-gradient-text">One Folder.</span>
          </h1>
          <p class="hl-sub hl-enter" style="--hl-delay: 0.12s">
            Briefs, copy, visuals and schedules — auto-filed by AI.
          </p>

          <div class="hero">
            <div class="hl-ring-deco ring-a"></div>
            <div class="hl-ring-deco hl-ring-deco--dashed ring-b"></div>
            <div class="hl-beam"></div>

            <div class="hl-enter" style="--hl-delay: 0.2s">
              <div class="folder-scene">
                <div class="folder hl-float">
                  <div class="tab"></div>
                  <div class="back"></div>

                  <div class="peek photo">
                    <div class="ph"></div>
                    <div class="cap"></div>
                    <div class="cap short"></div>
                  </div>
                  <div class="peek chart">
                    <div class="bars">
                      <i style="height: 42%"></i><i style="height: 68%"></i><i style="height: 52%"></i><i style="height: 92%"></i>
                    </div>
                    <div class="trend"></div>
                  </div>
                  <div class="peek doc">
                    <div class="line title"></div>
                    <div class="line"></div>
                    <div class="line"></div>
                    <div class="line short"></div>
                  </div>

                  <div class="front">
                    <div class="shine"></div>
                    <div class="emboss">
                      <div class="dots"><i></i><i></i><i></i></div>
                      <div class="slot"></div>
                    </div>
                  </div>

                  <div class="badge">
                    <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
                      <path
                        d="M13 2 4.5 13.5h6L10 22l8.5-11.5h-6L13 2Z"
                        fill="#ffffff"
                        stroke="rgba(255,255,255,0.6)"
                        stroke-width="0.6"
                        stroke-linejoin="round"
                      />
                    </svg>
                  </div>

                  <svg class="star" style="left: -128px; top: -40px; width: 40px; --hl-delay: 0.4s" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                    <path d="M12 2l2.2 6.8H21l-5.6 4.1 2.2 6.8L12 15.6l-5.6 4.1 2.2-6.8L3 8.8h6.8L12 2z" />
                  </svg>
                  <svg class="star" style="right: -114px; top: -14px; width: 26px; --hl-delay: 1.1s" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                    <path d="M12 2l2.2 6.8H21l-5.6 4.1 2.2 6.8L12 15.6l-5.6 4.1 2.2-6.8L3 8.8h6.8L12 2z" />
                  </svg>

                  <!-- Floating glossy mini tiles -->
                  <div class="hl-icon-tile hl-icon-tile--cyan float-tile ft1">
                    <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2.5" /><circle cx="9" cy="10" r="1.8" /><path d="M3 17l5-4 4 3 4.5-4L21 16" /></svg>
                  </div>
                  <div class="hl-icon-tile float-tile ft2">
                    <svg viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-8M22 20H2" /></svg>
                  </div>
                  <div class="hl-icon-tile hl-icon-tile--gold float-tile ft3">
                    <svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2.5" /><path d="M3 10h18M8 3v4M16 3v4" /></svg>
                  </div>
                </div>

                <div class="hl-pedestal">
                  <div class="hl-pedestal-disc d1"></div>
                  <div class="hl-pedestal-disc d2"></div>
                  <div class="hl-pedestal-disc d3"></div>
                  <div class="hl-pedestal-core"></div>
                </div>
                <div class="pedestal-reflection"></div>
              </div>
            </div>
          </div>

          <div class="stats hl-enter" style="--hl-delay: 0.28s">
            <div class="hl-stat hl-glass hl-glass--tight"><span class="hl-stat-value">2.4K</span><span class="hl-stat-label">Assets</span></div>
            <div class="hl-stat hl-glass hl-glass--tight"><span class="hl-stat-value">36</span><span class="hl-stat-label">Brands</span></div>
            <div class="hl-stat hl-glass hl-glass--tight"><span class="hl-stat-value">100%</span><span class="hl-stat-label">Synced</span></div>
          </div>

          <div class="chips hl-enter" style="--hl-delay: 0.34s">
            <span class="hl-chip"><span class="hl-chip-dot"></span>Auto-Filed</span>
            <span class="hl-chip hl-chip--cyan"><span class="hl-chip-dot"></span>Brand-Safe</span>
            <span class="hl-chip"><span class="hl-chip-dot"></span>Always Synced</span>
          </div>
          <div class="brand hl-enter" style="--hl-delay: 0.4s">Lixen<span>.AI</span></div>
        </div>
      </main>
    </div>

    <script>
      // Scale the fixed 1080×1080 canvas to fit the viewport
      (function () {
        var scaler = document.getElementById("scaler");
        function fit() {
          var s = Math.min(innerWidth / 1080, innerHeight / 1080);
          var x = (innerWidth - 1080 * s) / 2;
          var y = (innerHeight - 1080 * s) / 2;
          scaler.style.transform = "translate(" + x + "px," + y + "px) scale(" + s + ")";
        }
        addEventListener("resize", fit);
        fit();
      })();

      // Sparkle / bokeh particle layer
      (function () {
        var c = document.getElementById("sparkles");
        var ctx = c.getContext("2d");
        var W = (c.width = 1080);
        var H = (c.height = 1080);
        var ps = [];
        for (var i = 0; i < 55; i++) {
          ps.push({
            x: Math.random() * W,
            y: Math.random() * H,
            r: 0.8 + Math.random() * 2.8,
            p: Math.random() * Math.PI * 2,
            s: 0.4 + Math.random() * 1.2,
            hue: Math.random() > 0.5 ? "180" : "220",
          });
        }
        var reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;
        function draw(t) {
          ctx.clearRect(0, 0, W, H);
          ctx.globalCompositeOperation = "lighter";
          for (var i = 0; i < ps.length; i++) {
            var p = ps[i];
            var a = 0.25 + 0.75 * Math.abs(Math.sin(p.p + t * 0.001 * p.s));
            ctx.beginPath();
            ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
            ctx.fillStyle = "hsla(" + p.hue + ", 90%, 70%, " + a * 0.7 + ")";
            ctx.shadowColor = "hsla(" + p.hue + ", 90%, 70%, 0.9)";
            ctx.shadowBlur = 8;
            ctx.fill();
          }
          if (!reduced) requestAnimationFrame(draw);
        }
        requestAnimationFrame(draw);
      })();
    </script>
  </body>
</html>
