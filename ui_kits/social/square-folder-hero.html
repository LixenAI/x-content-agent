<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LixenAI — Square Folder Hero</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800&family=Inter:wght@500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../../styles.css" />
    <style>
      /* 1080×1080 (1:1) fixed canvas, scaled to fit the viewport */
      html,
      body {
        height: 100%;
        overflow: hidden;
        background: var(--hl-bg-deep);
        display: grid;
        place-items: center;
      }

      .slide-scaler {
        position: fixed;
        top: 0;
        left: 0;
        transform-origin: top left;
      }

      .slide {
        width: 1080px;
        height: 1080px;
      }

      .slide-inner {
        position: relative;
        z-index: 1;
        width: 100%;
        height: 100%;
        padding: 88px 80px 72px;
        display: flex;
        flex-direction: column;
        align-items: center;
      }

      .slide .hl-kicker {
        font-size: 20px;
        margin-bottom: 20px;
      }

      .slide h1 {
        font-size: 84px;
        text-align: center;
      }

      .slide .hl-sub {
        font-size: 26px;
        text-align: center;
        max-width: 640px;
        margin-top: 22px;
      }

      /* Glossy 3D folder hero */
      .hero {
        position: relative;
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: flex-end;
        width: 100%;
      }

      .folder {
        position: relative;
        width: 400px;
        height: 300px;
        filter: drop-shadow(0 40px 50px rgba(37, 99, 235, 0.35));
      }

      .folder .back {
        position: absolute;
        inset: 0;
        border-radius: 28px;
        background: linear-gradient(160deg, #3b82f6 0%, #1d4ed8 70%, #1b2a6b 100%);
      }

      .folder .tab {
        position: absolute;
        top: -34px;
        left: 0;
        width: 168px;
        height: 60px;
        border-radius: 22px 22px 0 0;
        background: linear-gradient(160deg, #3b82f6, #2563eb);
      }

      .folder .doc {
        position: absolute;
        left: 34px;
        right: 34px;
        top: -58px;
        bottom: 90px;
        border-radius: 16px;
        background: linear-gradient(180deg, #ffffff 0%, #e8f1fc 100%);
        box-shadow: 0 -6px 18px rgba(27, 42, 107, 0.16);
      }

      .folder .doc.d2 {
        left: 60px;
        right: 60px;
        top: -84px;
        background: linear-gradient(180deg, #f2f8ff 0%, #dcebfa 100%);
      }

      .folder .doc .line {
        height: 10px;
        border-radius: 6px;
        background: rgba(37, 99, 235, 0.22);
        margin: 0 26px;
      }
      .folder .doc .line:first-child { margin-top: 26px; }
      .folder .doc .line + .line { margin-top: 14px; }
      .folder .doc .line.short { width: 55%; }

      .folder .front {
        position: absolute;
        inset: 56px 0 0 0;
        border-radius: 26px;
        background:
          linear-gradient(165deg, rgba(255, 255, 255, 0.5) 0%, rgba(255, 255, 255, 0) 42%),
          linear-gradient(160deg, #60a5fa 0%, #2563eb 55%, #1e40af 100%);
        box-shadow: inset 0 2px 0 rgba(255, 255, 255, 0.55);
        transform: perspective(900px) rotateX(9deg);
        transform-origin: bottom center;
      }

      .folder .front .shine {
        position: absolute;
        inset: 0;
        border-radius: 26px;
        background: radial-gradient(120% 90% at 24% 8%, rgba(255, 255, 255, 0.55) 0%, transparent 46%);
      }

      .folder .bolt {
        position: absolute;
        left: 50%;
        top: 58%;
        transform: translate(-50%, -50%);
        width: 92px;
        height: 92px;
        z-index: 2;
      }

      /* Sparkle accents (gold — sparing) */
      .star {
        position: absolute;
        color: var(--hl-gold);
        filter: drop-shadow(0 0 10px rgba(245, 158, 11, 0.8));
        animation: hl-hover-float 5s ease-in-out infinite;
      }

      .hero .hl-pedestal { margin-top: -14px; }
      .hero .hl-pedestal-disc.d1 { width: 480px; height: 76px; }
      .hero .hl-pedestal-disc.d2 { width: 356px; height: 56px; margin-top: -46px; }
      .hero .hl-pedestal-core { width: 240px; height: 60px; bottom: 16px; }

      .chips {
        position: relative;
        z-index: 2;
        display: flex;
        gap: 18px;
        justify-content: center;
        margin-top: 40px;
      }

      .chips .hl-chip { font-size: 18px; }

      .brand {
        margin-top: 28px;
        font-family: var(--hl-font-display);
        font-weight: 800;
        letter-spacing: 0.26em;
        font-size: 19px;
        color: var(--hl-navy);
        text-transform: uppercase;
      }

      .brand span { color: var(--hl-primary); }
    </style>
  </head>
  <body>
    <div class="slide-scaler" id="scaler">
      <main class="slide hl-canvas">
        <canvas class="hl-sparkles" id="sparkles"></canvas>

        <div class="slide-inner">
          <div class="hl-kicker hl-enter" style="--hl-delay: 0s">Content, Organized</div>
          <h1 class="hl-heading hl-enter" style="--hl-delay: 0.06s">
            Every Asset.<br /><span class="hl-gradient-text">One Folder.</span>
          </h1>
          <p class="hl-sub hl-enter" style="--hl-delay: 0.12s">
            Briefs, copy, visuals and schedules — filed by AI before you even ask.
          </p>

          <div class="hero">
            <div class="hl-enter hl-float" style="--hl-delay: 0.2s">
              <div class="folder">
                <div class="tab"></div>
                <div class="back"></div>
                <div class="doc d2"></div>
                <div class="doc">
                  <div class="line"></div>
                  <div class="line"></div>
                  <div class="line short"></div>
                </div>
                <div class="front"><div class="shine"></div></div>
                <svg class="bolt" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                  <path
                    d="M13 2 4.5 13.5h6L10 22l8.5-11.5h-6L13 2Z"
                    fill="#ffffff"
                    stroke="rgba(255,255,255,0.6)"
                    stroke-width="0.6"
                    stroke-linejoin="round"
                  />
                </svg>
                <svg class="star" style="left: -66px; top: 10px; width: 40px; --hl-delay: 0.4s" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                  <path d="M12 2l2.2 6.8H21l-5.6 4.1 2.2 6.8L12 15.6l-5.6 4.1 2.2-6.8L3 8.8h6.8L12 2z" />
                </svg>
                <svg class="star" style="right: -58px; top: 96px; width: 26px; --hl-delay: 1.1s" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                  <path d="M12 2l2.2 6.8H21l-5.6 4.1 2.2 6.8L12 15.6l-5.6 4.1 2.2-6.8L3 8.8h6.8L12 2z" />
                </svg>
              </div>
              <div class="hl-pedestal">
                <div class="hl-pedestal-disc d1"></div>
                <div class="hl-pedestal-disc d2"></div>
                <div class="hl-pedestal-core"></div>
              </div>
            </div>
          </div>

          <div class="chips hl-enter" style="--hl-delay: 0.3s">
            <span class="hl-chip"><span class="hl-chip-dot"></span>Auto-Filed</span>
            <span class="hl-chip hl-chip--cyan"><span class="hl-chip-dot"></span>Brand-Safe</span>
            <span class="hl-chip"><span class="hl-chip-dot"></span>Always Synced</span>
          </div>
          <div class="brand hl-enter" style="--hl-delay: 0.38s">Lixen<span>.AI</span></div>
        </div>
      </main>
    </div>

    <script>
      // Scale the fixed 1080×1080 canvas to fit the viewport
      (function () {
        var scaler = document.getElementById("scaler");
        function fit() {
          var s = Math.min(innerWidth / 1080, innerHeight / 1080);
          var x = (innerWidth - 1080 * s) / 2;
          var y = (innerHeight - 1080 * s) / 2;
          scaler.style.transform = "translate(" + x + "px," + y + "px) scale(" + s + ")";
        }
        addEventListener("resize", fit);
        fit();
      })();

      // Sparkle / bokeh particle layer
      (function () {
        var c = document.getElementById("sparkles");
        var ctx = c.getContext("2d");
        var W = (c.width = 1080);
        var H = (c.height = 1080);
        var ps = [];
        for (var i = 0; i < 50; i++) {
          ps.push({
            x: Math.random() * W,
            y: Math.random() * H,
            r: 0.8 + Math.random() * 2.6,
            p: Math.random() * Math.PI * 2,
            s: 0.4 + Math.random() * 1.2,
            hue: Math.random() > 0.5 ? "180" : "220",
          });
        }
        var reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;
        function draw(t) {
          ctx.clearRect(0, 0, W, H);
          ctx.globalCompositeOperation = "lighter";
          for (var i = 0; i < ps.length; i++) {
            var p = ps[i];
            var a = 0.25 + 0.75 * Math.abs(Math.sin(p.p + t * 0.001 * p.s));
            ctx.beginPath();
            ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
            ctx.fillStyle = "hsla(" + p.hue + ", 90%, 70%, " + a * 0.7 + ")";
            ctx.shadowColor = "hsla(" + p.hue + ", 90%, 70%, 0.9)";
            ctx.shadowBlur = 8;
            ctx.fill();
          }
          if (!reduced) requestAnimationFrame(draw);
        }
        requestAnimationFrame(draw);
      })();
    </script>
  </body>
</html>
